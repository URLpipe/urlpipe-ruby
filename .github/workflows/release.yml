name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ["3.1", "3.2", "3.3", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test

  release:
    needs: test
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: write # rake release checks the tag against the remote
      id-token: write # trusted publishing (OIDC), no stored API key
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
          bundler-cache: true
      - name: Check the tag matches the gem version
        run: |
          version=$(ruby -Ilib -e 'require "urlpipe/version"; print Urlpipe::VERSION')
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Urlpipe::VERSION ${version}" >&2
            exit 1
          fi
      - uses: rubygems/release-gem@v1
